# Single-process Loki on the local filesystem; stores the Faro (browser) signals Alloy
# forwards. Sized for one small VM: 7-day retention, no replication.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  # Erasure on request (AICHAT-249): lines matching a delete request are hidden from queries at once and purged
  # from the chunks by the compactor. scripts/gdpr/loki-delete.ts submits the requests.
  deletion_mode: filter-and-delete

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  # A delete request can be cancelled for this long, then the compactor purges the lines (default 24h).
  delete_request_cancel_period: 1h

analytics:
  reporting_enabled: false
