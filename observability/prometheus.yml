# Prometheus scrape config for local docker-compose (US-2 AC-6).
# Each backend service exposes Prometheus-format metrics at GET /metrics via
# `prom-client` (STACK.md §3); see docs/pods/platform-foundation/CONVENTIONS.md §5 for
# the port convention each service must implement.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:4001"]
        labels:
          service: auth-service

  - job_name: conversation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["conversation-service:4002"]
        labels:
          service: conversation-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Container CPU and memory during a load run (AICHAT-24): scripts/load/docker-stats-sampler.ts
  # --serve 9105 runs on the host and serves the `docker stats` numbers. Without a run this
  # target is simply down.
  - job_name: load-sampler
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9105"]
