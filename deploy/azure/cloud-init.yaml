#cloud-config
# First-boot setup for the Azure VM (Ubuntu 24.04): Docker Engine + compose plugin,
# a 4 GB swap file (headroom for the 4 GB VM), and unattended
# security upgrades.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - unattended-upgrades
runcmd:
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker azureuser
  - systemctl enable --now docker
