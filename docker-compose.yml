# Local development environment (US-2). `docker compose up` starts every app, service,
# and supporting infrastructure. See docs/pods/platform-foundation/CONVENTIONS.md §5 for
# the port/health/metrics conventions every app/service Dockerfile must follow.
#
# Dockerfiles referenced below are owned by each app/service's own pod (not this one);
# this file only wires up build context, ports, env, volumes, networks, healthchecks,
# and depends_on ordering by the agreed path convention (apps/*/Dockerfile,
# services/*/Dockerfile). See docs/ARCHITECTURE.md §2 for path ownership.

name: llm-chat

networks:
  llm-chat:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmchat_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-llmchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmchat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - llm-chat

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AUTH_SERVICE_PORT:-4001}
      DATABASE_URL: ${AUTH_SERVICE_DATABASE_URL:-postgresql://llmchat:llmchat_local_dev@postgres:5432/llmchat?schema=auth}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      CORRELATION_HEADER: ${CORRELATION_HEADER:-X-Correlation-Id}
    ports:
      - "${AUTH_SERVICE_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_SERVICE_PORT:-4001}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - llm-chat

  conversation-service:
    build:
      context: .
      dockerfile: services/conversation-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CONVERSATION_SERVICE_PORT:-4002}
      DATABASE_URL: ${CONVERSATION_SERVICE_DATABASE_URL:-postgresql://llmchat:llmchat_local_dev@postgres:5432/llmchat?schema=conversation}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      CORRELATION_HEADER: ${CORRELATION_HEADER:-X-Correlation-Id}
    ports:
      - "${CONVERSATION_SERVICE_PORT:-4002}:4002"
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CONVERSATION_SERVICE_PORT:-4002}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - llm-chat

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-service
      - conversation-service
      - mfe-auth
      - mfe-chat
      - mfe-settings
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${SHELL_PORT:-3000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:4001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://localhost:4002}
      CORRELATION_HEADER: ${CORRELATION_HEADER:-X-Correlation-Id}
    ports:
      - "${SHELL_PORT:-3000}:3000"
    networks:
      - llm-chat

  mfe-auth:
    build:
      context: .
      dockerfile: apps/mfe-auth/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${MFE_AUTH_PORT:-3001}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:4001}
    ports:
      - "${MFE_AUTH_PORT:-3001}:3001"
    networks:
      - llm-chat

  mfe-chat:
    build:
      context: .
      dockerfile: apps/mfe-chat/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${MFE_CHAT_PORT:-3002}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://localhost:4002}
    ports:
      - "${MFE_CHAT_PORT:-3002}:3002"
    networks:
      - llm-chat

  mfe-settings:
    build:
      context: .
      dockerfile: apps/mfe-settings/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${MFE_SETTINGS_PORT:-3003}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://localhost:4002}
    ports:
      - "${MFE_SETTINGS_PORT:-3003}:3003"
    networks:
      - llm-chat

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - auth-service
      - conversation-service
    networks:
      - llm-chat

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      - prometheus
    networks:
      - llm-chat
