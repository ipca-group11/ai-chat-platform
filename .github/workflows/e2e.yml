# Separate from platform-foundation's owned .github/workflows/ci.yml (per
# docs/pods/quality-observability/PLAN.md task O8) so this pod never touches that
# file's path. Runs the Playwright suite (e2e/**, covering UC1-UC8 + Axe checks,
# AC-98/AC-99) against the full docker-compose stack.
#
# NOTE: per PLAN.md O8, this job is intended to be a required status check for
# merges to main (AC-100). Actually enabling that in branch protection is a
# repo-admin action outside any pod's file ownership - flagged for the
# integration pass.
name: e2e

# Team decision 2026-10-03 (AICHAT-17): the full suite takes 15+ minutes per run, so it no
# longer runs on pull requests or pushes. Run it by hand from the Actions tab
# (workflow_dispatch) before a release or when a change touches the user flows.
on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ports compose.yaml publishes (shell on APP_PORT 8000, APIs on 4001/4002); the
    # fixtures' fallbacks target a different local setup.
    env:
      BASE_URL: http://localhost:8000
      E2E_SHELL_HEALTH_URL: http://localhost:8000/
      E2E_AUTH_HEALTH_URL: http://localhost:4001/health
      E2E_CONVERSATION_HEALTH_URL: http://localhost:4002/health
      # The stack runs with the `llm` compose profile: conversation-service calls the LLM mock
      # (compose.mock.yaml), so the chat flows need no provider account. The mock accepts any
      # key; this value is a placeholder, not a secret.
      ANTHROPIC_API_KEY: mock-key-not-a-secret
      # The suite sends more than auth-service's 300 requests per 15 minutes, all from one address.
      AUTH_RATE_LIMIT_MAX: "0"
    steps:
      # Building every app image fills the runner's ~14 GB free disk; drop preinstalled
      # SDKs this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      # Brings up the full stack plus the mock server (profile `llm`): the providers are
      # the mock, never a real API.
      - name: Start docker compose stack (profile llm)
        run: pnpm mock:up

      - name: Wait for the stack to become healthy
        run: pnpm --filter e2e run wait-for-stack

      - name: Run Playwright E2E suite (UC1-UC8 and the chat flows against the mock)
        run: pnpm exec nx run e2e:e2e
        env:
          CI: "true"

      # AICHAT-10: one JSON per accessibility scan (page x state x theme), kept on every run so a
      # passing build still shows the moderate/minor findings; the table goes to the job summary.
      - name: Accessibility summary
        if: always()
        run: pnpm --filter e2e run --silent axe-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload axe-core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: e2e/axe-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Tear down docker compose stack
        if: always()
        run: pnpm mock:down
