# Dependency CVE scan (SCA). `pnpm audit --audit-level=high` exits non-zero when any
# high or critical advisory exists, which fails this job. Threshold: 0 high/critical.
name: sca

on:
  pull_request:
  push:
    branches: [main, integration/testing-epics]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: sca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: sca / pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies (fails on high or critical)
        run: pnpm audit --audit-level=high
