name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches `.factory/commands.json`'s `test` command exactly.
  NX_AFFECTED_TARGETS: lint typecheck test build size

jobs:
  affected:
    name: nx affected (lint, typecheck, test, build, size)
    runs-on: ubuntu-latest
    steps:
      # Full history so `nx affected` can diff against origin/main (AC-12, AC-13).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Matches `.factory/commands.json`'s `install` command.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repository scripts (scripts/**, mock-server build) are TypeScript run by Node directly:
      # typecheck them and run their own tests.
      - name: Typecheck and test the scripts
        run: |
          pnpm typecheck:scripts
          pnpm test:scripts

      # Nx Cloud isn't configured for this repo yet; a GitHub Actions cache keyed on
      # nx.json + the lockfile stands in for it so unaffected projects are replayed
      # from cache instead of re-run (AC-14).
      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Derive base/head for nx affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"

      # Fails the job (and PR) on any lint/typecheck/test/build error (AC-12, AC-13).
      # `size` (size-limit, gzip budgets per app, apps/*/.size-limit.ts) runs after the app's build and
      # fails the job when a bundle goes over its limit (AICHAT-83).
      # Vitest coverage thresholds (STACK.md decision #6) are enforced per-project as
      # part of each project's own `test` target, so a coverage regression fails this
      # step too without any separate CI step.
      - name: nx affected
        run: >
          pnpm exec nx affected
          -t ${{ env.NX_AFFECTED_TARGETS }}
          --base=${{ env.NX_BASE }}
          --head=${{ env.NX_HEAD }}

      # Per-project coverage table (from each project's coverage/coverage-summary.json)
      # in the job summary. Runs even when the test step failed, so a threshold drop
      # still shows which project fell.
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.ts

      # Bundle size before/after per file in the job summary (AICHAT-101). Builds the base branch in a
      # second checkout and compares it with the dist folders of this run; apps that were not affected
      # (no dist) are left out. Informational: it never fails the job, the budget is the `size` target.
      - name: Bundle size change
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        env:
          NX_DAEMON: "false"
        run: |
          node scripts/ci/bundle-size.ts snapshot --out "$RUNNER_TEMP/head-sizes.json"
          git worktree add --detach "$RUNNER_TEMP/base" "$NX_BASE"
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile && pnpm exec nx run-many -t build -p shell,mfe-auth,mfe-chat,mfe-settings)
          node scripts/ci/bundle-size.ts snapshot --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/base-sizes.json"
          node scripts/ci/bundle-size.ts report "$RUNNER_TEMP/base-sizes.json" "$RUNNER_TEMP/head-sizes.json"

  # Database tests (AICHAT-116): a real Postgres from Testcontainers, the schema applied with
  # `prisma db push`. Kept out of the `test` target so the unit loop needs no Docker; the GitHub
  # runner has Docker. Runs for both services that own a Prisma schema on every pull request.
  test-db:
    name: test-db (Testcontainers Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull the Postgres image (same version as compose.yaml)
        run: docker pull postgres:16-alpine

      - name: nx test-db
        run: pnpm exec nx run-many -t test-db -p auth-service,conversation-service --parallel=1

  # Consumer-driven contract tests (AICHAT-11). The consumers (mfe-auth, shell, mfe-settings,
  # mfe-chat, auth-service) write pacts/*.json from their real API client code; the providers
  # verify those same files in the next job. All of them run on every pull request, not only the
  # affected ones: a change on either side can break a pair that the Nx graph does not link, and
  # the whole set takes about a minute. No Pact Broker: the pacts are an artifact of this run.
  contracts-consumer:
    name: contracts (consumer pacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --skip-nx-cache: a cache hit would replay the log without writing the pact files.
      - name: nx pact:consumer
        run: pnpm exec nx run-many -t pact:consumer --skip-nx-cache

      - name: Upload the pacts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/
          if-no-files-found: error
          retention-days: 7

  # Provider verification (AICHAT-180, AICHAT-181): each service replays every pact written
  # for it against its real app with in-memory fakes. Known defects are listed in the
  # verifier and must keep failing until fixed (AICHAT-255, AICHAT-256).
  contracts-provider:
    name: contracts (verify ${{ matrix.provider }})
    needs: contracts-consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [auth-service, conversation-service]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the pacts of this run
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts

      - name: nx pact:verify
        run: pnpm exec nx run ${{ matrix.provider }}:pact:verify --skip-nx-cache

  # Source SBOM of the pnpm workspace (AICHAT-108): lists the npm packages the lockfile
  # resolves, for SCA on every pull request. Independent of the Nx job.
  source-sbom:
    name: source SBOM (pnpm workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-source.cdx.json
          output-file: sbom-source.cdx.json
          upload-artifact-retention: 90
