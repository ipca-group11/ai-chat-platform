# Load regression gate (AICHAT-24): k6 smoke against the compose stack with the LLM mock.
# Thresholds live in testing/k6/lib/scenarios.ts and make k6 exit non-zero (failing this job) when violated:
# REST p95 < 1000 ms, http_req_failed < 1 %, TTFT p95 < 1500 ms, stream_success_rate > 99 %.
#
# Required check: the job is named "load / smoke". Branch protection is not available on this private
# free-plan repository, so the team rule is: do not merge into main while "load / smoke" is red.
name: load

on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/testing-epics, main]
  workflow_dispatch: {}

concurrency:
  group: load-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The LLM mock accepts any key; this value is a placeholder, not a secret.
  ANTHROPIC_API_KEY: mock-key-not-a-secret
  REST_P95_MS: "1000"
  TTFT_P95_MS: "1500"

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      # The sampler and summary scripts run on Node's built-in TypeScript support, so the runner needs the pinned Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stack up, accounts seeded, then the smoke run; k6 exits non-zero when a threshold is crossed.
      - name: k6 smoke (thresholds gate)
        run: pnpm load:up && bash testing/k6/run.sh seed && bash testing/k6/run.sh smoke

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: |
            docs/AICHAT-24/results/smoke-summary.json
            docs/AICHAT-24/results/smoke-k6.txt
            docs/AICHAT-24/results/smoke-docker-stats.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down docker compose stack
        if: always()
        run: pnpm mock:down
