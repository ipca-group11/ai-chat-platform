name: Security

on:
  pull_request:
  push:
    branches: [main, integration/testing-epics]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full history so the commit range base..head exists locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits of this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "range=$range"
          set +e
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="$range"
          code=$?
          {
            echo "### Secret scan (gitleaks ${GITLEAKS_VERSION})"
            echo "Range: \`$range\`"
            if [ "$code" -eq 0 ]; then echo "Result: no leaks found."; else echo "Result: **leaks found** (values are redacted in the log). The merge is blocked."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sast-summary.ts runs on Node's built-in TypeScript support, so the runner needs the pinned Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Scan with Semgrep CE (pinned image)
        run: scripts/ci/semgrep.sh semgrep-results

      # Writes the Markdown table to the job summary, then fails the job when an unsuppressed ERROR
      # finding exists. WARNING and INFO are listed but never fail.
      - name: Summary table and merge gate
        run: |
          set +e
          node scripts/ci/sast-summary.ts semgrep-results/semgrep.sarif > semgrep-results/summary.md
          code=$?
          cat semgrep-results/summary.md
          cat semgrep-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: |
            semgrep-results/semgrep.sarif
            semgrep-results/summary.md
          if-no-files-found: warn
          retention-days: 14
