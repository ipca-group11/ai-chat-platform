# Builds every app image, pushes it to GHCR, and rolls the Azure VM onto it. The VM never
# builds anything: it only pulls the images tagged with this commit's SHA (see
# deploy/azure/README.md).
#
# Runs after CI passes on main, or by hand (Actions → deploy → Run workflow).
# Needs: secret VM_SSH_KEY (private key for azureuser@VM), secret VM_KNOWN_HOSTS
# (the VM's ssh host key line), variable DOMAIN (the VM's public hostname).
name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # workflow_run checks out the commit CI actually tested, not whatever main is now.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: auth-service, dockerfile: services/auth-service/Dockerfile }
          - { name: conversation-service, dockerfile: services/conversation-service/Dockerfile }
          - { name: mfe-auth, dockerfile: apps/mfe-auth/Dockerfile }
          - { name: mfe-chat, dockerfile: apps/mfe-chat/Dockerfile }
          - { name: mfe-settings, dockerfile: apps/mfe-settings/Dockerfile }
          - { name: shell, dockerfile: apps/shell/Dockerfile }
          - { name: prometheus, dockerfile: observability/prometheus.Dockerfile }
          - { name: grafana, dockerfile: observability/grafana.Dockerfile }
          - { name: loki, dockerfile: observability/loki.Dockerfile }
          - { name: alloy, dockerfile: observability/alloy.Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon and scan it (AICHAT-7). HIGH+ findings fail the job
      # before anything reaches GHCR, so the deploy never starts. The push below reuses the
      # layer cache. Run instructions: docs/AICHAT-7/README.md.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:${{ env.SHA }}
          # The shell bakes the remotes' public URLs, the Faro collector URL and its
          # version into its bundle; the other images ignore these args.
          build-args: |
            VITE_MFE_AUTH_URL=https://${{ vars.DOMAIN }}:3001
            VITE_MFE_CHAT_URL=https://${{ vars.DOMAIN }}:3002
            VITE_MFE_SETTINGS_URL=https://${{ vars.DOMAIN }}:3003
            VITE_FARO_URL=https://${{ vars.DOMAIN }}/collect
            VITE_APP_VERSION=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan (HIGH+ blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ env.SHA }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-${{ matrix.name }}.json

      - name: Keep Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}.json
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 90

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          # The shell bakes the remotes' public URLs, the Faro collector URL and its
          # version into its bundle; the other images ignore these args.
          build-args: |
            VITE_MFE_AUTH_URL=https://${{ vars.DOMAIN }}:3001
            VITE_MFE_CHAT_URL=https://${{ vars.DOMAIN }}:3002
            VITE_MFE_SETTINGS_URL=https://${{ vars.DOMAIN }}:3003
            VITE_FARO_URL=https://${{ vars.DOMAIN }}/collect
            VITE_APP_VERSION=${{ env.SHA }}
          # Attestations travel with the image in GHCR (AICHAT-53): the SPDX SBOM and the
          # SLSA provenance. Check with `docker buildx imagetools inspect <image> --format
          # '{{ json .SBOM }}'` (or `.Provenance`).
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Downloadable CycloneDX SBOM of the image just pushed (AICHAT-70), one artifact per
      # image, named sbom-<name>.cdx.json. Format and hand-off: docs/AICHAT-30/SBOM-INTERFACE.md.
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.SHA }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cdx.json
          output-file: sbom-${{ matrix.name }}.cdx.json
          upload-artifact-retention: 90

  # The two images we run but do not build. They get the same SBOM artifact name pattern.
  sbom-third-party:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: postgres, image: "postgres:16-alpine" }
          - { name: caddy, image: "caddy:2-alpine" }
    steps:
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}.cdx.json
          output-file: sbom-${{ matrix.name }}.cdx.json
          upload-artifact-retention: 90

  # Reports known vulnerabilities found in the SBOMs. It does not fail the run: the
  # severity threshold that blocks a deploy belongs to AICHAT-7 (see SBOM-INTERFACE.md).
  scan-sbom:
    needs: [build, sbom-third-party]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*.cdx.json
          path: sbom
          merge-multiple: true

      - uses: anchore/scan-action/download-grype@v6
        id: grype

      - name: Grype report (does not fail)
        run: |
          for f in sbom/sbom-*.cdx.json; do
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ${{ steps.grype.outputs.cmd }} "sbom:$f" -o table >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: [build, sbom-third-party]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy/azure

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose files
        run: |
          ssh azureuser@${{ vars.DOMAIN }} 'mkdir -p ~/ai-chat'
          scp deploy/azure/docker-compose.yml deploy/azure/Caddyfile azureuser@${{ vars.DOMAIN }}:ai-chat/

      # Caddy's container doesn't change when only the Caddyfile does, so `up` leaves it
      # running the old routes; reload it explicitly.
      - name: Pull and restart
        run: |
          ssh azureuser@${{ vars.DOMAIN }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && cd ~/ai-chat \
            && export IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' IMAGE_TAG='${{ env.SHA }}' \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans --wait --wait-timeout 300 \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile; \
            status=\$?; docker logout ghcr.io; docker image prune -f >/dev/null; exit \$status"

      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://${{ vars.DOMAIN }}/
