version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/shell
      - /apps/mfe-auth
      - /apps/mfe-chat
      - /apps/mfe-settings
      - /testing/k6
      - /testing/mock-server
    schedule:
      interval: weekly
